# Reusable: docs-audit (T6). The standing audit: docs lint, the link check with external URLs
# and the docs facts check, then the checklist for the latest release. Run it after every
# release (workflow_dispatch) and monthly (schedule). It opens nothing: a failing run is the
# signal, and the dated result is kept as an artifact.
#
# Adopt it:
#
#   docs-audit:
#     uses: dsd-toolbox/dsd-toolbox/.github/workflows/docs-audit.yml@SHA
#     with:
#       tools_ref: SHA

name: docs-audit

on:
  workflow_call:
    inputs:
      tools_ref:
        description: "Commit of dsd-toolbox/dsd-toolbox whose tools/docs to run; empty uses the calling repository's own copy"
        type: string
        default: ""
      name:
        description: "Repository name when .docs.toml does not give one"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  audit:
    name: docs audit
    runs-on: ubuntu-latest
    timeout-minutes: 10   # a stuck job must not hold the runner (a pull request can feed any input)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the docs tools
        if: inputs.tools_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dsd-toolbox/dsd-toolbox
          ref: ${{ inputs.tools_ref }}
          path: .docs-tools
          persist-credentials: false

      - name: The release checklist
        env:
          TOOLS: ${{ inputs.tools_ref != '' && '.docs-tools/tools/docs' || 'tools/docs' }}
          NAME: ${{ inputs.name }}
          GITHUB_TOKEN: ${{ github.token }}   # read-only (permissions: contents: read); lifts the API rate limit of the facts check
        run: python3 -I "$TOOLS/docs_audit.py" . ${NAME:+--name "$NAME"} --release --out audit >> "$GITHUB_STEP_SUMMARY"

      - name: Lint, links and facts
        env:
          TOOLS: ${{ inputs.tools_ref != '' && '.docs-tools/tools/docs' || 'tools/docs' }}
          NAME: ${{ inputs.name }}
          GITHUB_TOKEN: ${{ github.token }}   # read-only (permissions: contents: read); lifts the API rate limit of the facts check
        run: python3 -I "$TOOLS/docs_audit.py" . ${NAME:+--name "$NAME"} --check --out audit

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: docs-audit
          path: audit
          retention-days: 90
