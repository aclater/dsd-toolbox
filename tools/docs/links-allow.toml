# External sites that refuse automated requests (bot walls, login walls) or rate-limit hard.
# docs_links.py does not fetch URLs under these prefixes; a person opens them by hand when a
# page changes. Every entry says why. Repositories add their own in .docs.toml ([[links.allow]]).

